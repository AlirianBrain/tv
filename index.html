<meta charset="utf-8">
<title>POP24 Studio Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap">
<style>
  :root {
    /* POP24 brand (media24.com/lifestyle-tv/pop24): teal disc, white italic serif wordmark, aqua "24" */
    --teal: #005970;
    --teal-deep: #003E50;
    --teal-ink: #0B3A48;
    --aqua: #7FDBD3;
    --aqua-deep: #3FB8AE;
    --white: #FFFFFF;
    --card: #FFFFFF;
    --on-teal: #FFFFFF;
    --on-teal-muted: rgba(255, 255, 255, .74);
    --on-teal-dim: rgba(255, 255, 255, .45);
    --muted: #5B7480;
    --dim: #9AB0B8;
    --rec: #E2493A;
    --amber: #D99A2B;
    --closed: #9FB3BA;
    --wall-top: #FFFFFF;
    --wall-front: #E9EEF0;
    --wall-side: #D3DDE1;
    --slab-top: #F8FAFA;
    --slab-front: #DCE5E8;
    --slab-side: #C6D2D7;
    --floor: #F3F6F7;
    --foyer: #E4ECEF;
    --core: #EDF1F3;
    --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --text: 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  html { font-size: clamp(9px, calc(100vw / 105), 40px); }   /* scales with width: 18px at 1080p, 37px at 4K */
  body { margin: 0; background: var(--teal); color: var(--on-teal); font-family: var(--text); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .board { position: relative; height: 100vh; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr; gap: .2rem; padding: .8rem 1.3rem .6rem; }
  /* The angled wedge Media24 uses across its pages, kept to one quiet corner. */
  .board::before { content: ''; position: absolute; left: 0; top: 0; width: 18rem; height: 7.5rem; background: var(--teal-deep); clip-path: polygon(0 0, 100% 0, 55% 100%, 0 100%); pointer-events: none; }
  .board > * { position: relative; }

  /* Masthead */
  .masthead { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2rem; }
  .today { text-align: right; }
  .clock-line { display: flex; justify-content: flex-end; align-items: baseline; gap: .8rem; margin-top: .35rem; }
  .clock-line .clock-time { font-size: 1.6rem; }
  .brand { display: flex; align-items: center; gap: 1rem; }
  .ring { position: relative; width: 4rem; height: 4rem; flex: none; border-radius: 50%; background: var(--white); color: var(--teal); display: grid; place-items: center; font-family: var(--display); font-style: italic; font-weight: 700; font-size: 1.7rem; line-height: 1; letter-spacing: -.03em; padding-right: .4rem; box-sizing: border-box; }
  .ring small { position: absolute; right: .42rem; top: .78rem; font-family: var(--text); font-style: normal; font-weight: 600; font-size: .66rem; color: var(--aqua-deep); letter-spacing: 0; }
  .brand-text { display: flex; flex-direction: column; gap: .2rem; }
  .brand-title { font-weight: 800; font-size: 1.45rem; line-height: 1; letter-spacing: -.01em; }
  .brand-sub { font-size: .74rem; color: var(--aqua); letter-spacing: .18em; text-transform: uppercase; font-weight: 600; }
  .today-day { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 2.3rem; line-height: 1; letter-spacing: -.02em; }
  .today-date { font-size: 1.05rem; color: var(--on-teal-muted); margin-top: .3rem; font-variant-numeric: tabular-nums; font-weight: 500; }
  .today-flag { display: inline-block; margin-left: .7rem; padding: .15rem .65rem; border: .09rem solid var(--aqua); border-radius: 999px; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--aqua); font-weight: 600; vertical-align: middle; }
  .today-flag[hidden] { display: none; }
  .clock { text-align: right; }
  .clock-time { font-weight: 700; font-size: 2.7rem; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .clock-sub { font-size: .88rem; color: var(--on-teal-muted); margin-top: .35rem; font-weight: 500; }

  /* The plan fills whatever is left of the screen */
  .plan-wrap { position: relative; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .plan { position: relative; }
  .plan svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .tag { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: .1rem; pointer-events: none; text-align: center; white-space: nowrap; background: var(--card); color: var(--teal-ink); border-radius: .55rem; padding: .42rem .85rem .48rem; box-shadow: 0 .4rem 1.2rem rgba(0, 38, 51, .24); }
  .tag::after { content: ''; position: absolute; left: 50%; bottom: -.4rem; width: .85rem; height: .85rem; background: var(--card); transform: translateX(-50%) rotate(45deg); }
  .tag-room { font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .tag-show { font-weight: 800; font-size: 1.38rem; line-height: 1.08; max-width: 15rem; white-space: normal; text-wrap: balance; letter-spacing: -.01em; }
  .tag-logo { display: block; max-width: 7.3rem; max-height: 3.3rem; width: auto; height: auto; margin: .15rem 0 .1rem; object-fit: contain; }
  .tag-phase { display: inline-flex; align-items: center; gap: .4rem; font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tag-phase .dot { width: .58rem; height: .58rem; border-radius: 50%; background: currentColor; }
  /* Light artwork (white wordmarks on transparent canvases) gets a dark chip so it stays visible */
  .tag.logo-dark { background: var(--teal-ink); color: var(--white); }
  .tag.logo-dark::after { background: var(--teal-ink); }
  .tag.logo-dark .tag-room { color: var(--aqua); }
  .tag.logo-dark .tag-phase { color: var(--on-teal-muted); }
  .tag.logo-dark.is-rec .tag-phase { color: #FF8A7A; }
  .tag.logo-dark.is-prep .tag-phase { color: #F6BF4E; }
  .tag.is-rec .tag-phase { color: var(--rec); }
  .tag.is-prep .tag-phase { color: var(--amber); }
  .tag.is-free .tag-phase { color: var(--aqua-deep); }
  .tag.is-free .tag-phase .dot { background: transparent; border: .1rem solid currentColor; box-sizing: border-box; }
  .tag.is-closed .tag-show, .tag.is-free .tag-show { color: var(--dim); font-weight: 700; font-size: 1.15rem; }
  .tag.support { background: transparent; box-shadow: none; padding: 0; transform: translate(-50%, -50%); }
  .tag.support::after { display: none; }
  .tag.support .tag-room { color: var(--teal-ink); font-size: .84rem; letter-spacing: .07em; line-height: 1.1; font-weight: 800; text-shadow: 0 0 .35rem #fff, 0 0 .7rem #fff, 0 .05rem .15rem rgba(255,255,255,.9); }
  .tag.here { transform: translate(-50%, .9rem); background: var(--teal-ink); color: var(--white); align-items: center; padding: .45rem .85rem; }
  .tag.here::after { left: 50%; bottom: auto; top: -.36rem; transform: translateX(-50%) rotate(45deg); background: var(--teal-ink); }
  .tag.here .tag-room { color: var(--aqua); font-size: .78rem; }

  .stamp { position: absolute; right: 2rem; bottom: .55rem; font-size: .68rem; color: var(--on-teal-dim); font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: .04em; }

  /* The wandering girl with the POP24 balloon: drawn on its own layer above the plan and the chips */
  .walker { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 3; }
  .walker .girl { transition: opacity 1.6s ease; }
  .walker .leg { transform-box: fill-box; transform-origin: 50% 0; }
  .walker.walking .leg-l { animation: step 0.7s ease-in-out infinite; }
  .walker.walking .leg-r { animation: step 0.7s ease-in-out infinite reverse; }
  .walker .balloon-group { animation: bob 3.2s ease-in-out infinite; }
  @keyframes step { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.4px); } }
  @media (prefers-reduced-motion: reduce) { .walker .leg, .walker .balloon-group { animation: none !important; } }
  .pin-pulse { animation: ring 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { opacity: .55; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.5); } }
  @media (prefers-reduced-motion: reduce) { .pin-pulse { animation: none; opacity: 0; } }
  /* Phones and portrait screens: the TV layout is fixed 16:9, so here the page stacks and scrolls instead. */
  @media (max-aspect-ratio: 1/1), (max-width: 700px) {
    html { font-size: clamp(11px, calc(100vw / 34), 16px); }
    body { overflow: auto; }
    .board { height: auto; min-height: 100vh; grid-template-rows: auto auto; align-content: start; gap: 1rem; padding: 1rem 1rem 2.4rem; }
    .board::before { width: 9rem; height: 4rem; }
    .masthead { grid-template-columns: 1fr; gap: .8rem; }
    .today, .clock { text-align: left; }
    .plan-wrap { display: block; }
    .plan { width: 100% !important; }
    .tag-show { font-size: 1rem; max-width: 9rem; }
    .tag { padding: .3rem .55rem .35rem; }
    .stamp { position: static; display: block; margin-top: .6rem; text-align: left; }
  }
</style>

<main class="board">
  <header class="masthead">
    <div class="brand">
      <div class="ring" aria-label="POP24">pop<small>24</small></div>
      <div class="brand-text">
        <div class="brand-title">Studio board</div>
        <div class="brand-sub">22nd floor</div>
      </div>
    </div>
    <div class="today">
      <div class="today-day" id="todayDay">Monday</div>
      <div class="today-date"><span id="todayDate">7 September 2026</span><span class="today-flag" id="todayFlag" hidden></span></div>
      <div class="clock-line"><span class="clock-time" id="clock">00:00</span><span class="clock-sub" id="summary">Loading schedule</span></div>
    </div>
  </header>

  <div class="plan-wrap" id="planWrap">
    <div class="plan" id="plan" aria-live="polite"></div>
  </div>
</main>

<script>
  // The nightly sync replaces schedule.json next to this page; the page re-reads it on load and at 00:05.
  // If the file is missing (for example when this page is opened on its own), the embedded snapshot is used.
  const DATA_URL = 'schedule.json';

  let DATA = JSON.parse(document.getElementById('schedule-data').textContent);
  let DAY_INDEX = new Map(DATA.days.map((d, i) => [d.date, i]));
  const PLAN = JSON.parse(document.getElementById('floorplan-data').textContent);
  // Show logos: [{match: 'oud en jonk', src: 'data:image/png;base64,...'}], inlined by tools/inject_data.py
  // from data/show-logos.json. A booked room shows the logo instead of the title when one matches.
  const LOGOS = JSON.parse(document.getElementById('logo-data').textContent);
  // The name that appears first in the booking text wins ("Versus paint x Gesels 10" shows Versus Paint);
  // on a tie the longer, more specific match wins.
  // A show named in the booking always wins over a client brand: the show's logo if we have it, plain text if not.
  // Brand logos only appear on bookings that name no show (a sponsor or corporate shoot).
  function findLogo(title) {
    const t = title.toLowerCase();
    const pick = kind => {
      let best = null;
      for (const l of LOGOS) {
        if ((l.kind || 'show') !== kind) continue;
        const i = t.indexOf(l.match.toLowerCase());
        if (i < 0) continue;
        if (!best || i < best.i || (i === best.i && l.match.length > best.len)) best = { i, len: l.match.length, src: l.src, dark: !!l.dark };
      }
      return best;
    };
    const show = pick('show');
    if (show) return show.src ? { src: show.src, dark: show.dark } : null;
    const brand = pick('brand');
    return brand && brand.src ? { src: brand.src, dark: brand.dark } : null;
  }
  const STUDIO_IDS = ['studio-a', 'studio-b', 'studio-c', 'led-volume', 'food-studio', 'podcast'];

  const PHASES = [
    [/\bFINAL TECH MOVE ?-?IN\b/i, 'Final tech move-in', 'prep'],
    [/\bTECH(?:NICAL)? MOVE ?-?IN\b/i, 'Tech move-in', 'prep'],
    [/\bTECH(?:NICAL)? DAY\b/i, 'Tech day', 'prep'],
    [/\bTECH WEEK\b/i, 'Tech week', 'prep'],
    [/\bTECH(?:NICAL)? SET ?-?UP\b/i, 'Tech setup', 'prep'],
    [/\bART SET ?-?UP\b/i, 'Art setup', 'prep'],
    [/\bSET ?-?UP\b/i, 'Set build', 'prep'],
    [/\bMOVE ?-?IN\b/i, 'Move-in', 'prep'],
    [/\bDRY RUN\b/i, 'Dry run', 'prep'],
    [/\bHOLDING SPACE\b/i, 'Holding space', 'prep'],
    [/\bSTRIKE\b/i, 'Strike', 'prep'],
    [/\bPILOT(?: SHOOT)?\b/i, 'Pilot', 'rec'],
    [/\bTEST SHOOT\b/i, 'Test shoot', 'rec'],
    [/\bN\/A\b|\bNOT AVAILABLE\b|\bUNAVAILABLE\b/i, 'Not available', 'closed'],
  ];
  function parseLabel(label) {
    let title = label, phase = null, cat = 'rec';
    for (const [re, name, c] of PHASES) {
      if (re.test(title)) { if (!phase) { phase = name; cat = c; } title = title.replace(re, ' '); }
    }
    if (cat === 'closed') title = title.replace(/\b(tech|studio)\b/gi, ' ');
    title = title.replace(/\s+/g, ' ').replace(/^[\s:\-–—/,.()]+|[\s:\-–—/,.]+$/g, '').trim();
    return { title, phase: phase || 'Recording', cat };
  }

  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dayEntry = iso => { const i = DAY_INDEX.get(iso); return i === undefined ? null : DATA.days[i]; };

  // ---------- Planometric clay model of the real 22nd floor ----------
  // Plan units are metres (see data/floorplan-22.json). The plan is rotated 18 degrees so the
  // long floor lies across a 16:9 screen, depth is foreshortened, walls stand vertical.
  // Camera is nearly overhead (FY close to 1) so rooms keep their plan shape; walls are kept low.
  const S = 10, A = 18 * Math.PI / 180, FY = 0.94, ZK = 0.8;
  const SIN = Math.sin(A), COS = Math.cos(A);
  const SLAB_H = 0.9, PLATE_H = .18, WALL_H = 1.5, WALL_T = .35, DOOR = 1.6;
  const ISO = (x, y, z = 0) => [(x * COS + y * SIN) * S, (-x * SIN + y * COS) * FY * S - z * ZK * S];
  const pts = a => a.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  function facesOf(b) {
    const { x, y, w, d, z0, h } = b, zt = z0 + h;
    return {
      top:  [ISO(x, y, zt), ISO(x + w, y, zt), ISO(x + w, y + d, zt), ISO(x, y + d, zt)],
      west: [ISO(x, y, zt), ISO(x, y + d, zt), ISO(x, y + d, z0), ISO(x, y, z0)],
      south:[ISO(x, y + d, zt), ISO(x + w, y + d, zt), ISO(x + w, y + d, z0), ISO(x, y + d, z0)],
    };
  }
  const poly = (p, fill, extra = '') => `<polygon points="${pts(p)}" fill="${fill}" stroke="${fill}" stroke-width=".5" stroke-linejoin="round" ${extra}/>`;
  function drawBox(b) {
    const f = facesOf(b);
    return poly(f.west, b.fills.side) + poly(f.south, b.fills.front) + poly(f.top, b.fills.top) +
      (b.tint ? poly(f.top, b.tint, 'opacity=".38"') : '');
  }
  const depth = b => -(b.x + b.w / 2) * SIN + (b.y + b.d / 2) * COS;
  const WALL = { top: 'var(--wall-top)', front: 'var(--wall-front)', side: 'var(--wall-side)' };
  const SLAB = { top: 'var(--slab-top)', front: 'var(--slab-front)', side: 'var(--slab-side)' };
  function wallBoxes(r) {
    const t = WALL_T, out = [];
    const seg = (x, y, w, d) => out.push({ x, y, w, d, z0: SLAB_H + PLATE_H, h: WALL_H, fills: WALL });
    const split = (len, start) => { const a = start + len / 2 - DOOR / 2; return [[start, a - start], [a + DOOR, start + len - (a + DOOR)]]; };
    if (r.door === 'back') split(r.w, r.x).forEach(([s, l]) => seg(s, r.y, l, t)); else seg(r.x, r.y, r.w, t);
    if (r.door === 'front') split(r.w, r.x).forEach(([s, l]) => seg(s, r.y + r.d - t, l, t)); else seg(r.x, r.y + r.d - t, r.w, t);
    if (r.door === 'left') split(r.d, r.y).forEach(([s, l]) => seg(r.x, s, t, l)); else seg(r.x, r.y, t, r.d);
    if (r.door === 'right') split(r.d, r.y).forEach(([s, l]) => seg(r.x + r.w - t, s, t, l)); else seg(r.x + r.w - t, r.y, t, r.d);
    return out;
  }
  function pinSVG(px, py, color, pulse) {
    const lift = 2.0 * S, k = S / 15;   // smaller pin: leaves more room for the chip above it
    return `<ellipse cx="${px}" cy="${py}" rx="${.7 * S}" ry="${.3 * S}" fill="rgba(0,38,51,.16)"/>` +
      (pulse ? `<circle class="pin-pulse" cx="${px}" cy="${py - lift - 24 * k}" r="${1.25 * S}" fill="none" stroke="${color}" stroke-width="2"/>` : '') +
      `<path transform="translate(${px} ${py - lift}) scale(${k})" fill="${color}" d="M0,2 C0,2 -17,-13 -17,-24 C-17,-34 -9.5,-41 0,-41 C9.5,-41 17,-34 17,-24 C17,-13 0,2 0,2 Z"/>` +
      `<circle cx="${px}" cy="${py - lift - 24 * k}" r="${6 * k}" fill="#fff"/>`;
  }

  let VB = null;
  function buildPlan(cells) {
    const slabs = PLAN.slab.map(s => ({ ...s, z0: 0, h: SLAB_H, fills: SLAB }));
    const plates = [], walls = [], pins = [], tags = [];
    for (const o of PLAN.open) plates.push({ ...o, z0: SLAB_H, h: PLATE_H, fills: { top: o.foyer ? 'var(--foyer)' : 'var(--floor)', front: SLAB.front, side: SLAB.side } });
    for (const r of PLAN.rooms) {
      const cell = r.id ? cells[r.id] : null;
      const parsed = cell ? parseLabel(cell.label) : null;
      const tint = cell && cell.color && parsed.cat !== 'closed' ? `#${cell.color}` : null;
      plates.push({ x: r.x, y: r.y, w: r.w, d: r.d, z0: SLAB_H, h: PLATE_H, tint,
        fills: { top: r.core ? 'var(--core)' : 'var(--floor)', front: SLAB.front, side: SLAB.side } });
      walls.push(...wallBoxes(r));
      const [px, py] = ISO(r.ax ?? (r.x + r.w / 2), r.ay ?? (r.y + r.d / 2), SLAB_H + PLATE_H);
      if (!r.id) {
        if (r.name) {
          // Narrow rooms get their name stacked one word per line, so the label clearly sits inside its own room.
          let lines = r.lines || [r.name];
          if (!r.lines && r.w < 5.5 && r.name.includes(' ')) {
            lines = [];
            for (const w of r.name.split(' ')) { if (/^\d+$/.test(w) && lines.length) lines[lines.length - 1] += ' ' + w; else lines.push(w); }
          }
          tags.push({ px, py: py + (r.dy || 0) * S, cls: 'support', room: lines.join('\n') });
        }
        continue;
      }
      if (parsed) {
        const color = parsed.cat === 'rec' ? 'var(--rec)' : parsed.cat === 'prep' ? 'var(--amber)' : 'var(--closed)';
        pins.push(pinSVG(px, py, color, parsed.cat === 'rec'));
        const title = parsed.title || (parsed.cat === 'closed' ? 'Closed' : cell.label);
        const lg = parsed.cat === 'closed' ? null : findLogo(title);
        tags.push({ px, py: py - 4.9 * S, cls: 'is-' + parsed.cat, room: r.sub ? r.name + ' · ' + r.sub : r.name, show: title, logo: lg && lg.src, dark: !!(lg && lg.dark), phase: parsed.phase });
      } else {
        tags.push({ px, py: py - 1.0 * S, cls: 'is-free', room: r.sub ? r.name + ' · ' + r.sub : r.name, show: 'Available', phase: 'Free today' });
      }
    }
    // The TV itself: a small screen standing on the wall it hangs from, so viewers can find themselves.
    if (PLAN.tv) {
      const t = PLAN.tv, z = SLAB_H + PLATE_H + .55;
      walls.push({ x: t.x - t.w / 2, y: t.y, w: t.w, d: .16, z0: z, h: 1.0, fills: { top: '#0B3A48', front: '#0B3A48', side: '#0B3A48' } });
      walls.push({ x: t.x - t.w / 2 + .1, y: t.y + .17, w: t.w - .2, d: .02, z0: z + .1, h: .8, fills: { top: 'var(--aqua)', front: 'var(--aqua)', side: 'var(--aqua)' } });
    }
    const [hx, hy] = ISO(PLAN.here.x, PLAN.here.y, SLAB_H + PLATE_H);
    pins.push(pinSVG(hx, hy, 'var(--teal)', false));
    tags.push({ px: hx, py: hy + .3 * S, cls: 'here', room: 'You are here' });
    walls.sort((a, b) => depth(a) - depth(b));
    slabs.sort((a, b) => depth(a) - depth(b));

    const corners = [];
    for (const b of [...slabs, ...walls]) for (const f of Object.values(facesOf(b))) corners.push(...f);
    corners.push([hx, hy - 7 * S]);
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const [x, y] of corners) { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }
    const padX = 1.2 * S, padY = 3 * S;   // headroom above the model for the chips of the back row of rooms
    VB = { x: minX - padX, y: minY - padY, w: maxX - minX + 2 * padX, h: maxY - minY + padY + 1 * S };

    const svg = `<svg viewBox="${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}" xmlns="http://www.w3.org/2000/svg" aria-label="Plan of the 22nd floor studios">
      <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="180%"><feDropShadow dx="0" dy="${1.2 * S}" stdDeviation="${1.2 * S}" flood-color="#00212C" flood-opacity=".45"/></filter></defs>
      <g filter="url(#soft)">${slabs.map(drawBox).join('')}</g>
      ${plates.map(drawBox).join('')}
      ${walls.map(drawBox).join('')}
      ${pins.join('')}
    </svg>`;
    const tagHTML = tags.map(t => {
      const left = ((t.px - VB.x) / VB.w * 100).toFixed(2), top = ((t.py - VB.y) / VB.h * 100).toFixed(2);
      return `<div class="tag ${t.cls}${t.dark ? ' logo-dark' : ''}" style="left:${left}%;top:${top}%">
        <span class="tag-room">${esc(t.room).replace(/\n/g, '<br>')}</span>${t.logo ? `<img class="tag-logo" src="${t.logo}" alt="${esc(t.show)}">` : t.show ? `<span class="tag-show">${esc(t.show)}</span>` : ''}${t.phase ? `<span class="tag-phase"><i class="dot"></i>${esc(t.phase)}</span>` : ''}
      </div>`;
    }).join('');
    document.getElementById('plan').innerHTML = svg + tagHTML;
    Walker.mount();
    fitPlan();
  }

  // ---------- The girl with the POP24 balloon ----------
  // An original little figure who wanders the corridors, drifts into rooms and lingers, and now and then leaves
  // by the lifts. She lives on her own layer above the plan and the chips so the balloon is always in view.
  // ?girl=off hides her; ?girl=fast runs her clock 60x for checking.
  const Walker = (() => {
    const mode = new URLSearchParams(location.search).get('girl') || 'on';
    const T = mode === 'fast' ? 60 : 1, SPEED = 0.9;            // time scale, metres per second
    const CY = 7.55, EAST_Y = 6.6, FOYER_X = 35.6, LIFT = { x: FOYER_X, y: 16.5 };
    const rand = (a, b) => a + Math.random() * (b - a);
    const MIN = 60;

    function places() {
      const out = [];
      for (const r of PLAN.rooms) {
        if (r.core || !r.name) continue;
        const cx = r.x + r.w / 2;
        const inside = () => [rand(r.x + 1.2, r.x + r.w - 1.2), rand(r.y + 1.2, r.y + r.d - 1.2)];
        if (r.name === 'Art room') out.push({ kind: 'room', via: () => [[30.15, CY], [30.15, 6.3], [30.15, 3.2], [32.1, 3.2], [rand(33.5, 39.5), rand(1.5, 5)]] });
        else if (r.id === 'studio-a') out.push({ kind: 'room', via: () => [[45.5, CY], [45.5, r.y + r.d / 2], inside()] });
        else if (r.door === 'front' && r.y < 1 && r.x + r.w <= 46) out.push({ kind: 'room', via: () => [[cx, CY], [cx, r.y + r.d], inside()] });
        else if (r.door === 'back' && r.y > 8 && r.x + r.w <= 34) out.push({ kind: 'room', via: () => [[cx, CY], [cx, r.y], inside()] });
        else if (r.door === 'front' && r.x >= 46) out.push({ kind: 'room', via: () => [[45.5, CY], [45.5, EAST_Y], [cx, EAST_Y], [cx, r.y + r.d], inside()] });
      }
      const strolls = [
        { kind: 'stroll', via: () => [[rand(2, 45), CY]] },
        { kind: 'stroll', via: () => [[FOYER_X, CY], [FOYER_X, rand(10, 15)]] },
      ];
      const away = { kind: 'away', via: () => [[FOYER_X, CY], [LIFT.x, LIFT.y]] };
      return { rooms: out, strolls, away };
    }

    let P = null, pos = { x: LIFT.x, y: LIFT.y }, route = [[FOYER_X, CY], [LIFT.x, LIFT.y]];
    let path = [], dwellUntil = 0, kind = 'away', shown = false, facing = 1, el = null, girlEl = null, last = null;

    function choose() {
      const r = Math.random();
      const place = r < 0.6 ? P.rooms[Math.floor(Math.random() * P.rooms.length)] : r < 0.85 ? P.strolls[Math.floor(Math.random() * P.strolls.length)] : P.away;
      const next = place.via();
      path = route.slice().reverse().slice(1).concat(next);   // back out to the corridor, then on to the new spot
      route = next; kind = place.kind;
      if (!shown) { shown = true; if (girlEl) girlEl.style.opacity = 1; }
    }
    function dwell() {
      const now = performance.now() / 1000 * T;
      if (kind === 'room') dwellUntil = now + rand(3 * MIN, 60 * MIN);
      else if (kind === 'away') { dwellUntil = now + rand(10 * MIN, 45 * MIN); shown = false; if (girlEl) girlEl.style.opacity = 0; }
      else dwellUntil = now + rand(20, 90);
    }

    function figure() {
      return `<defs>
        <radialGradient id="gBalloon" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#2C8BA3"/><stop offset=".55" stop-color="#005970"/><stop offset="1" stop-color="#003544"/></radialGradient>
        <radialGradient id="gSkin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#F6DCC8"/><stop offset="1" stop-color="#D9A98C"/></radialGradient>
        <linearGradient id="gDress" x1="0" x2="1"><stop offset="0" stop-color="#1F6F86"/><stop offset="1" stop-color="#083E50"/></linearGradient>
        <linearGradient id="gHair" x1="0" x2="1"><stop offset="0" stop-color="#4A3630"/><stop offset="1" stop-color="#241A16"/></linearGradient>
      </defs>
      <g class="girl" style="opacity:0">
        <ellipse class="shadow" cx="0" cy="0" rx="4.2" ry="1.5" fill="rgba(0,38,51,.22)"/>
        <g class="body">
          <g class="leg leg-l"><rect x="-1.9" y="-5.2" width="1.5" height="5.2" rx=".7" fill="url(#gSkin)"/><ellipse cx="-1.15" cy="-.2" rx="1.1" ry=".55" fill="#0B3A48"/></g>
          <g class="leg leg-r"><rect x=".4" y="-5.2" width="1.5" height="5.2" rx=".7" fill="url(#gSkin)"/><ellipse cx="1.15" cy="-.2" rx="1.1" ry=".55" fill="#0B3A48"/></g>
          <path d="M-2.2,-12.2 L2.2,-12.2 L3.7,-4.9 L-3.7,-4.9 Z" fill="url(#gDress)"/>
          <path d="M-1.9,-11.6 L-2.6,-7.4" stroke="#D9A98C" stroke-width="1.15" stroke-linecap="round"/>
          <path d="M1.8,-11.6 L4.3,-16.2" stroke="#E9C4AC" stroke-width="1.15" stroke-linecap="round"/>
          <circle cx="0" cy="-14.7" r="2.6" fill="url(#gSkin)"/>
          <path d="M-2.9,-14.8 A2.9,2.9 0 0 1 2.9,-14.8 L2.9,-13.1 L2.15,-13.1 L2.15,-14.3 A2.15,2.15 0 0 0 -2.15,-14.3 L-2.15,-13.1 L-2.9,-13.1 Z" fill="url(#gHair)"/>
          <path d="M4.3,-16.2 Q5.2,-20.5 7.2,-24.2" stroke="#3C4A52" stroke-width=".35" fill="none"/>
        </g>
        <g class="balloon-group">
          <g transform="translate(7.6,-31)">
            <path d="M-.9,6.4 L.9,6.4 L0,7.6 Z" fill="#003544"/>
            <circle r="6.6" fill="url(#gBalloon)"/>
            <ellipse cx="-2.3" cy="-3.1" rx="1.6" ry="1" fill="rgba(255,255,255,.55)" transform="rotate(-30 -2.3 -3.1)"/>
            <text x="-.6" y="1.7" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="700" font-size="5.4" fill="#fff">pop</text>
            <text x="3.7" y="-1.5" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="1.9" fill="#7FDBD3">24</text>
          </g>
        </g>
      </g>`;
    }

    function mount() {
      if (mode === 'off' || !VB) return;
      if (!el) {
        el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        el.setAttribute('class', 'walker');
        el.innerHTML = figure();
        girlEl = el.querySelector('.girl');
        P = places();
      }
      el.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
      document.getElementById('plan').appendChild(el);
      draw();
    }
    function draw() {
      if (!girlEl) return;
      const [px, py] = ISO(pos.x, pos.y, SLAB_H + PLATE_H);
      girlEl.setAttribute('transform', `translate(${px.toFixed(2)} ${py.toFixed(2)}) scale(1.35)`);
      girlEl.querySelector('.body').setAttribute('transform', `scale(${facing} 1)`);
    }
    function tick() {
      if (!el || !girlEl) return;
      const t = performance.now() / 1000 * T;
      const dt = last === null ? 0 : Math.min(2 * T, t - last); last = t;
      if (path.length === 0) {
        if (t >= dwellUntil) choose();
        el.classList.remove('walking');
        return;
      }
      let left = SPEED * dt;
      while (left > 0 && path.length) {
        const [tx, ty] = path[0];
        const dx = tx - pos.x, dy = ty - pos.y, dist = Math.hypot(dx, dy);
        if (dx !== 0) facing = dx < 0 ? -1 : 1;
        if (dist <= left) { pos = { x: tx, y: ty }; path.shift(); left -= dist; if (!path.length) dwell(); }
        else { pos = { x: pos.x + dx / dist * left, y: pos.y + dy / dist * left }; left = 0; }
      }
      el.classList.toggle('walking', path.length > 0);
      draw();
    }
    function start() {
      if (mode === 'off') return;
      dwellUntil = performance.now() / 1000 * T + (mode === 'fast' ? 2 : rand(20, 60));
      setInterval(tick, 40);   // a timer, not animation frames: keeps going when the browser throttles a hidden tab
    }
    const debug = () => ({ pos, path: path.slice(0, 4), pathLen: path.length, dwellUntil, kind, shown, last, T, now: performance.now() / 1000 * T });
    return { mount, start, debug };
  })();

  // Size the plan box to the largest rectangle of the plan's aspect that fits the space,
  // so the percentage-positioned tags line up with the SVG exactly.
  function fitPlan() {
    if (!VB) return;
    const wrap = document.getElementById('planWrap'), plan = document.getElementById('plan');
    const W = wrap.clientWidth, H = wrap.clientHeight, ratio = VB.w / VB.h;
    const stacked = window.matchMedia('(max-aspect-ratio: 1/1), (max-width: 700px)').matches;
    let w = W, h = W / ratio;
    if (!stacked && h > H) { h = H; w = H * ratio; }
    plan.style.width = w + 'px'; plan.style.height = h + 'px';
  }

  const state = { date: null, pinned: false };

  function render() {
    const iso = state.date, entry = dayEntry(iso), d = fromISO(iso);
    document.getElementById('todayDay').textContent = WEEKDAYS[d.getDay()];
    document.getElementById('todayDate').textContent = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    const flag = document.getElementById('todayFlag');
    const flagText = entry ? (entry.holiday || (entry.isWeekend ? 'Weekend' : '')) : 'Outside the schedule';
    flag.textContent = flagText; flag.hidden = !flagText;
    const cells = entry ? entry.cells : {};
    buildPlan(cells);
    const inUse = STUDIO_IDS.filter(id => cells[id] && parseLabel(cells[id].label).cat !== 'closed').length;
    document.getElementById('summary').textContent = !entry ? 'No schedule for this date'
      : inUse === 0 ? 'All studios available' : `${inUse} of ${STUDIO_IDS.length} studios in use`;
  }

  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    if (!state.pinned && toISO(now) !== state.date) { state.date = toISO(now); render(); }
  }

  function showUpdated() {
    // No visible stamp on the board any more; the read time stays available in the console for checks.
    const src = DATA.source || {};
    if (src.extractedAt) console.info('Schedule read ' + src.extractedAt.replace('T', ' ').slice(0, 16) + ' from ' + (src.file || ''));
  }

  // Nightly refresh: re-fetch the JSON just after midnight (and on load) when DATA_URL is set.
  async function refreshData() {
    if (!DATA_URL) return;
    try {
      const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      DATA = await r.json();
      DAY_INDEX = new Map(DATA.days.map((d, i) => [d.date, i]));
      showUpdated(); render();
    } catch (e) { /* keep showing the last good schedule */ }
  }
  function scheduleNightly() {
    const now = new Date(), next = new Date(now); next.setHours(24, 5, 0, 0);
    setTimeout(() => { refreshData(); scheduleNightly(); }, next - now);
  }

  (function init() {
    // ?date=YYYY-MM-DD shows another day for testing; the TV runs without parameters.
    const start = new URLSearchParams(location.search).get('date');
    showUpdated();
    state.pinned = !!(start && DAY_INDEX.has(start));
    state.date = state.pinned ? start : toISO(new Date());
    render();
    tickClock(); setInterval(tickClock, 1000);
    refreshData(); scheduleNightly();
    Walker.start();
    window.addEventListener('resize', fitPlan);
  })();
</script>
